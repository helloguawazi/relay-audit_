[meta]
# Identifies this run configuration in the report.
name = "relay-audit default"
# Report warns when a result set is older than this many days.
stale_after_days = 14

[tests]
# Warm-up requests, discarded from statistics.
warmup = 2

# --- speed suite ---
speed_requests = 15
speed_max_tokens = 8
speed_prompt_tokens = 120          # approximate; filler text is generated deterministically

# --- cache suite ---
cache_prefix_tokens = 3000         # must be above the provider's minimum cacheable prefix
cache_max_tokens = 8
cache_warm_passes = 3              # repeat the identical request this many times
cache_ttl_seconds = 300            # wait this long before the "expired" pass; 0 disables pass C
cache_min_speedup_ratio = 1.15     # warm TTFT must be at least this much faster to count as physical evidence

# --- billing suite ---
billing_tolerance_pct = 15.0       # allowed drift between the local tokenizer and reported prompt_tokens

# --- per-request network behaviour ---
timeout_seconds = 120

# Retries are intentionally fixed at 0. A retry hides a failure, and the failure
# rate is itself one of this tool's findings.
max_retries = 0

# Requests are always issued strictly sequentially. Concurrent requests contend
# for the same upstream channel and would corrupt every latency number below.

# ---------------------------------------------------------------------------
# Endpoints
#
# role = reference | candidate | peer
#   reference : a first-party or publicly benchmarked endpoint. Required.
#   candidate : the endpoint under audit.
#   peer      : an independently operated relay, publicly known and actually paid for.
#               Do not use a strawman: it is the fastest way to get a report dismissed.
#
# `rate` is what the endpoint charges, USD per million tokens. Omit it to fall
# back to the published official rate in rates.toml.
# ---------------------------------------------------------------------------

[[endpoint]]
id = "openrouter"
label = "OpenRouter"
role = "reference"
protocol = "openai"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_KEY"
model = "anthropic/claude-sonnet-5"
enabled = true

[[endpoint]]
id = "candidate"
label = "Candidate Relay"
role = "candidate"
protocol = "openai"
base_url = "https://www.relay-api.com/v1"
key_env = "RELAY_A_KEY"
model = "claude-sonnet-5"
enabled = true
# This relay publishes its prices in CNY. The currency must be declared, never
# inferred: a CNY figure read as USD is off by the exchange rate, which would
# misreport this table as a 7x markup. Pin the rate with --fx if you do not
# want the live lookup.
currency = "CNY"

# Optional: override the collected price with figures read from your own
# dashboard. Use this when the platform does not publish prices publicly.
# [[rates]]
# endpoint = "peer"
# model = "claude-sonnet-5"
# input = 2.20
# output = 11.00
# currency = "USD"
# retrieved = "2026-09-15"
# note = "价格取自登录后控制台，截图见 results/"

[[endpoint]]
id = "peer"
label = "Peer Relay"
role = "peer"
protocol = "openai"
base_url = "https://peer.invalid/v1"
key_env = "PEER_KEY"
model = "claude-sonnet-5"
enabled = false                    # enable once a real, publicly known peer is configured
