# Canonical model catalogue.
#
# Every model that appears in a published price table must be declared here.
# Anything a provider offers that matches no entry is reported as "unmatched"
# rather than being silently dropped, so that coverage gaps stay visible.
#
# `match` patterns are globs evaluated against a normalised model id. Because
# normalisation folds spaces and dots to hyphens, one pattern covers all the
# shapes relays publish:
#
#     'claude-opus-4.8'  matches  'claude-opus-4.8', 'Claude Opus 4.8',
#                                 'anthropic/claude-opus-4-8'
#
# Patterns must be tight. A loose 'claude-opus-*' would fold Opus 4.6, 4.7, 4.8
# and 5 into one row even though their prices differ, which would silently
# misreport every platform. Version numbers are therefore always pinned.
#
# `aliases` are checked before `match`, so an exact entry can never be shadowed
# by a broader wildcard.
#
# official_* are reference rates in USD per 1,000,000 tokens. Both `source` and
# `retrieved` are mandatory on any entry that has them: a rate without a source
# and a date is a rumour, and the table generator flags it.

[claude-sonnet-5]
display = "Claude Sonnet 5"
match = ["claude-sonnet-5"]
official_input = 2.00
official_output = 10.00
official_cache_read = 0.20
official_cache_write = 2.50
context = "1M"
source = "https://openrouter.ai/api/v1/models (anthropic/claude-sonnet-5)"
retrieved = "2026-09-15"

